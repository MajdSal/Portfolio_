<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Layered management dashboard with an ascending track">
  <defs>
    <linearGradient id="msPanel" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="msTrack" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7FA8C9" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#BBCCD7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="msBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7FA8C9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#BBCCD7" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="msHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FA8C9" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7FA8C9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="450" cy="350" rx="390" ry="320" fill="url(#msHalo)"/>

  <!-- stacked panels in perspective -->
  <g transform="translate(450 350) skewY(-9) translate(-450 -350)">
    <!-- back panel -->
    <rect x="220" y="120" width="500" height="150" rx="22"
          fill="url(#msPanel)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
    <g fill="#ffffff" fill-opacity="0.4">
      <rect x="252" y="152" width="96" height="8" rx="4"/>
      <rect x="252" y="174" width="150" height="6" rx="3"/>
    </g>

    <!-- middle panel: bar chart -->
    <rect x="180" y="278" width="560" height="180" rx="24"
          fill="url(#msPanel)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.75"/>
    <g fill="url(#msBar)">
      <rect x="222" y="384" width="34" height="42" rx="8"/>
      <rect x="276" y="358" width="34" height="68" rx="8"/>
      <rect x="330" y="396" width="34" height="30" rx="8"/>
      <rect x="384" y="336" width="34" height="90" rx="8"/>
      <rect x="438" y="368" width="34" height="58" rx="8"/>
      <rect x="492" y="322" width="34" height="104" rx="8"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.45">
      <rect x="222" y="312" width="72" height="8" rx="4"/>
      <rect x="614" y="330" width="86" height="6" rx="3"/>
      <rect x="614" y="350" width="64" height="6" rx="3"/>
      <rect x="614" y="370" width="78" height="6" rx="3"/>
      <rect x="614" y="390" width="52" height="6" rx="3"/>
    </g>

    <!-- front panel: task rows -->
    <rect x="250" y="470" width="460" height="128" rx="22"
          fill="url(#msPanel)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
    <g fill="#ffffff" fill-opacity="0.5">
      <circle cx="286" cy="506" r="7"/>
      <rect x="306" y="502" width="150" height="7" rx="3.5"/>
      <circle cx="286" cy="542" r="7"/>
      <rect x="306" y="538" width="196" height="7" rx="3.5"/>
      <circle cx="286" cy="578" r="7"/>
      <rect x="306" y="574" width="120" height="7" rx="3.5"/>
    </g>
  </g>

  <!-- the "masar" (track) climbing through the stack -->
  <path d="M150 590 C 300 570, 330 430, 460 400 S 660 330, 790 150"
        fill="none" stroke="url(#msTrack)" stroke-width="4.5" stroke-linecap="round"/>
  <g fill="#ffffff">
    <circle cx="150" cy="590" r="7" opacity="0.55"/>
    <circle cx="460" cy="400" r="8" opacity="0.8"/>
    <circle cx="790" cy="150" r="11" opacity="1"/>
    <circle cx="790" cy="150" r="21" opacity="0.22"/>
  </g>
</svg>
