<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI core embedded inside a product panel">
  <defs>
    <radialGradient id="aiG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#7FA8C9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7FA8C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aiP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- host product panel -->
  <rect x="46" y="46" width="308" height="228" rx="22" fill="url(#aiP)" stroke="#fff" stroke-opacity="0.22" stroke-width="1.8"/>
  <g fill="#fff" fill-opacity="0.35">
    <rect x="70" y="72" width="64" height="7" rx="3.5"/>
    <rect x="70" y="240" width="96" height="6" rx="3"/>
    <rect x="264" y="240" width="60" height="6" rx="3"/>
  </g>

  <!-- embedded AI core -->
  <circle cx="200" cy="160" r="86" fill="url(#aiG)"/>
  <circle cx="200" cy="160" r="54" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.4" stroke-width="1.8"/>
  <circle cx="200" cy="160" r="32" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.3" stroke-dasharray="5 9"/>

  <!-- feature taps into the host -->
  <g fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="1.8" stroke-linecap="round">
    <path d="M200 106 V 74"/>
    <path d="M254 160 H 300"/>
    <path d="M146 160 H 100"/>
    <path d="M200 214 V 244"/>
  </g>
  <g fill="#fff">
    <circle cx="200" cy="74" r="5" opacity="0.9"/>
    <circle cx="300" cy="160" r="5" opacity="0.6"/>
    <circle cx="100" cy="160" r="5" opacity="0.6"/>
    <circle cx="200" cy="244" r="5" opacity="0.6"/>
  </g>
</svg>
