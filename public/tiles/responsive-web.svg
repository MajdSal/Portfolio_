<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Phone and desktop layouts side by side">
  <defs>
    <radialGradient id="rwG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9FC2E8" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#9FC2E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rwP" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="160" rx="185" ry="150" fill="url(#rwG)"/>

  <!-- desktop -->
  <rect x="96" y="56" width="266" height="168" rx="14" fill="url(#rwP)" stroke="#fff" stroke-opacity="0.26" stroke-width="1.8"/>
  <rect x="96" y="56" width="266" height="24" rx="14" fill="#fff" fill-opacity="0.1"/>
  <rect x="96" y="70" width="266" height="10" fill="#fff" fill-opacity="0.1"/>
  <g fill="#fff" fill-opacity="0.4">
    <rect x="120" y="98" width="90" height="9" rx="4.5"/>
    <rect x="120" y="118" width="150" height="6" rx="3"/>
    <rect x="120" y="136" width="126" height="6" rx="3"/>
  </g>
  <g stroke="#fff" stroke-opacity="0.2" stroke-width="1.3">
    <rect x="120" y="160" width="70" height="46" rx="9" fill="#fff" fill-opacity="0.08"/>
    <rect x="200" y="160" width="70" height="46" rx="9" fill="#fff" fill-opacity="0.08"/>
    <rect x="280" y="160" width="60" height="46" rx="9" fill="#fff" fill-opacity="0.08"/>
  </g>
  <!-- stand -->
  <path d="M196 224 h 66 l 10 26 h -86 z" fill="#fff" fill-opacity="0.12"/>

  <!-- phone, overlapping in front -->
  <rect x="30" y="118" width="98" height="172" rx="18" fill="url(#rwP)" stroke="#fff" stroke-opacity="0.42" stroke-width="2"/>
  <rect x="60" y="130" width="38" height="6" rx="3" fill="#fff" fill-opacity="0.35"/>
  <g fill="#fff" fill-opacity="0.45">
    <rect x="46" y="154" width="52" height="8" rx="4"/>
    <rect x="46" y="172" width="66" height="5" rx="2.5"/>
  </g>
  <g stroke="#fff" stroke-opacity="0.22" stroke-width="1.2">
    <rect x="46" y="192" width="66" height="34" rx="8" fill="#fff" fill-opacity="0.09"/>
    <rect x="46" y="234" width="66" height="34" rx="8" fill="#fff" fill-opacity="0.09"/>
  </g>
  <circle cx="79" cy="280" r="5" fill="#fff" fill-opacity="0.3"/>
</svg>
