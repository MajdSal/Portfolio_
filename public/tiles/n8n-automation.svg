<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Automation flow with a repeating loop">
  <defs>
    <radialGradient id="n8G" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E9A8C9" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#E9A8C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="n8P" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="150" rx="185" ry="145" fill="url(#n8G)"/>

  <!-- flow connectors -->
  <g fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2.2" stroke-linecap="round">
    <path d="M112 120 H 158"/>
    <path d="M242 120 H 288"/>
  </g>

  <!-- nodes -->
  <g stroke="#fff" stroke-opacity="0.35" stroke-width="1.8">
    <rect x="42" y="88" width="70" height="64" rx="18" fill="url(#n8P)"/>
    <rect x="165" y="88" width="70" height="64" rx="18" fill="url(#n8P)"/>
    <rect x="288" y="88" width="70" height="64" rx="18" fill="url(#n8P)"/>
  </g>
  <g fill="#E9A8C9">
    <circle cx="77" cy="120" r="9"/>
    <circle cx="200" cy="120" r="9"/>
    <circle cx="323" cy="120" r="9"/>
  </g>

  <!-- the recurring loop back to the trigger -->
  <path d="M323 152 C 323 232, 250 250, 200 250 C 150 250, 77 232, 77 152"
        fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2.2"
        stroke-linecap="round" stroke-dasharray="9 8"/>
  <path d="M77 168 l -9 -16 h 18 z" fill="#fff" fill-opacity="0.75"/>
  <circle cx="200" cy="250" r="5" fill="#fff" opacity="0.7"/>
</svg>
