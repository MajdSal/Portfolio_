<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kanban board with task cards across three columns">
  <defs>
    <radialGradient id="wpG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FD4E8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7FD4E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wpC" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.07"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="160" rx="185" ry="150" fill="url(#wpG)"/>

  <!-- columns -->
  <g fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.16" stroke-width="1.4">
    <rect x="28" y="52" width="106" height="216" rx="14"/>
    <rect x="147" y="52" width="106" height="216" rx="14"/>
    <rect x="266" y="52" width="106" height="216" rx="14"/>
  </g>
  <g fill="#fff" fill-opacity="0.4">
    <rect x="46" y="70" width="46" height="7" rx="3.5"/>
    <rect x="165" y="70" width="38" height="7" rx="3.5"/>
    <rect x="284" y="70" width="42" height="7" rx="3.5"/>
  </g>
  <g fill="#7FD4E8">
    <circle cx="118" cy="73" r="4"/><circle cx="237" cy="73" r="4"/><circle cx="356" cy="73" r="4"/>
  </g>

  <!-- cards -->
  <g fill="url(#wpC)" stroke="#fff" stroke-opacity="0.24" stroke-width="1.3">
    <rect x="42" y="94" width="78" height="46" rx="9"/>
    <rect x="42" y="150" width="78" height="46" rx="9"/>
    <rect x="42" y="206" width="78" height="46" rx="9"/>
    <rect x="161" y="94" width="78" height="46" rx="9"/>
    <rect x="161" y="150" width="78" height="46" rx="9"/>
    <rect x="280" y="94" width="78" height="46" rx="9"/>
  </g>
  <g fill="#fff" fill-opacity="0.42">
    <rect x="54" y="106" width="40" height="6" rx="3"/><rect x="54" y="120" width="54" height="5" rx="2.5"/>
    <rect x="54" y="162" width="50" height="6" rx="3"/><rect x="54" y="176" width="36" height="5" rx="2.5"/>
    <rect x="54" y="218" width="34" height="6" rx="3"/><rect x="54" y="232" width="52" height="5" rx="2.5"/>
    <rect x="173" y="106" width="46" height="6" rx="3"/><rect x="173" y="120" width="32" height="5" rx="2.5"/>
    <rect x="173" y="162" width="36" height="6" rx="3"/><rect x="173" y="176" width="50" height="5" rx="2.5"/>
    <rect x="292" y="106" width="42" height="6" rx="3"/><rect x="292" y="120" width="30" height="5" rx="2.5"/>
