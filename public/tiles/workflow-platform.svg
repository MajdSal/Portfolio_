  <!-- card moving between columns -->
  <path d="M243 172 C 258 172, 262 128, 276 122" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.8" stroke-dasharray="6 6"/>
  <path d="M276 122 l -12 -4 l 3 10 z" fill="#fff" fill-opacity="0.7"/>
