<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Management dashboard with sidebar, metrics and a trend line">
  <defs>
    <radialGradient id="mdG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9A2F0" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#C9A2F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mdP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="mdL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A2F0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="160" rx="185" ry="150" fill="url(#mdG)"/>

  <rect x="30" y="44" width="340" height="232" rx="18" fill="url(#mdP)" stroke="#fff" stroke-opacity="0.24" stroke-width="1.8"/>

  <!-- sidebar -->
  <rect x="30" y="44" width="76" height="232" rx="18" fill="#fff" fill-opacity="0.07"/>
  <g fill="#fff" fill-opacity="0.4">
    <rect x="48" y="76" width="40" height="7" rx="3.5"/>
    <rect x="48" y="102" width="30" height="6" rx="3"/>
    <rect x="48" y="124" width="36" height="6" rx="3"/>
    <rect x="48" y="146" width="26" height="6" rx="3"/>
  </g>
  <rect x="42" y="96" width="4" height="18" rx="2" fill="#C9A2F0"/>

  <!-- KPI tiles -->
  <g stroke="#fff" stroke-opacity="0.2" stroke-width="1.4">
    <rect x="124" y="68" width="72" height="50" rx="12" fill="#fff" fill-opacity="0.08"/>
    <rect x="212" y="68" width="72" height="50" rx="12" fill="#fff" fill-opacity="0.08"/>
    <rect x="300" y="68" width="52" height="50" rx="12" fill="#fff" fill-opacity="0.08"/>
  </g>
  <g fill="#fff" fill-opacity="0.5">
    <rect x="138" y="82" width="30" height="9" rx="4.5"/>
    <rect x="138" y="99" width="44" height="5" rx="2.5"/>
    <rect x="226" y="82" width="24" height="9" rx="4.5"/>
    <rect x="226" y="99" width="44" height="5" rx="2.5"/>
    <rect x="314" y="82" width="20" height="9" rx="4.5"/>
    <rect x="314" y="99" width="24" height="5" rx="2.5"/>
  </g>

  <!-- trend chart -->
  <rect x="124" y="134" width="228" height="120" rx="12" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.16" stroke-width="1.3"/>
  <path d="M144 226 L 184 200 L 220 212 L 258 168 L 296 184 L 334 150"
        fill="none" stroke="url(#mdL)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="334" cy="150" r="6" fill="#fff"/>
  <circle cx="334" cy="150" r="12" fill="#fff" opacity="0.22"/>
</svg>
