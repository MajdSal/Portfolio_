<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prism refracting light into a spectrum across glass bands">
  <defs>
    <radialGradient id="gsG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9A2F0" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#C9A2F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gsPrism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="160" rx="185" ry="150" fill="url(#gsG)"/>

  <!-- incoming beam -->
  <path d="M26 128 L 150 156" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>

  <!-- prism -->
  <path d="M168 92 L 236 196 L 100 196 z" fill="url(#gsPrism)" stroke="#fff" stroke-opacity="0.5" stroke-width="2" stroke-linejoin="round"/>

  <!-- refracted spectrum -->
  <g stroke-width="3.4" stroke-linecap="round" fill="none">
    <path d="M228 178 L 372 132" stroke="#E9457F" stroke-opacity="0.85"/>
    <path d="M229 184 L 374 152" stroke="#E9A8C9" stroke-opacity="0.8"/>
    <path d="M230 190 L 375 172" stroke="#F0D48A" stroke-opacity="0.75"/>
    <path d="M231 196 L 375 192" stroke="#3FBF86" stroke-opacity="0.7"/>
    <path d="M231 202 L 374 212" stroke="#7FD4E8" stroke-opacity="0.7"/>
    <path d="M232 208 L 372 232" stroke="#9FA2F0" stroke-opacity="0.65"/>
  </g>

  <!-- glass bands drifting behind -->
  <g fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="2">
    <path d="M40 250 C 110 226, 180 274, 250 250 S 330 226, 372 246"/>
    <path d="M40 274 C 110 250, 180 298, 250 274 S 330 250, 372 270"/>
  </g>
  <circle cx="150" cy="156" r="6" fill="#fff" opacity="0.9"/>
</svg>
