<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Edit timeline with clips and an aperture">
  <defs>
    <radialGradient id="peG" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#E9A8C9" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#E9A8C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="150" rx="185" ry="150" fill="url(#peG)"/>

  <!-- aperture -->
  <g transform="translate(200 122)">
    <circle r="62" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2.4"/>
    <circle r="42" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.28" stroke-width="1.5"/>
    <g stroke="#fff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round">
      <path d="M0 -42 L 36 -21"/>
      <path d="M36 -21 L 36 21"/>
      <path d="M36 21 L 0 42"/>
      <path d="M0 42 L -36 21"/>
      <path d="M-36 21 L -36 -21"/>
      <path d="M-36 -21 L 0 -42"/>
    </g>
    <circle r="11" fill="#E9A8C9" opacity="0.85"/>
  </g>

  <!-- timeline track -->
  <rect x="34" y="216" width="332" height="62" rx="12" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.18" stroke-width="1.4"/>
  <g fill="url(#peC)" stroke="#fff" stroke-opacity="0.24" stroke-width="1.2">
    <rect x="48" y="230" width="70" height="34" rx="7"/>
    <rect x="126" y="230" width="46" height="34" rx="7"/>
    <rect x="180" y="230" width="88" height="34" rx="7"/>
    <rect x="276" y="230" width="76" height="34" rx="7"/>
  </g>
  <!-- playhead -->
  <g>
    <rect x="204" y="206" width="3" height="84" rx="1.5" fill="#fff" opacity="0.9"/>
    <path d="M197 206 h 17 l -8.5 11 z" fill="#fff" opacity="0.9"/>
  </g>
</svg>
