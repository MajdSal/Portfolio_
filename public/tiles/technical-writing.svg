<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bilingual document pages, left-to-right and right-to-left">
  <defs>
    <radialGradient id="twG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E9A8C9" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#E9A8C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="twP" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="160" rx="185" ry="150" fill="url(#twG)"/>

  <!-- English page: lines flush left -->
  <g transform="rotate(-6 130 160)">
    <rect x="52" y="52" width="156" height="204" rx="14" fill="url(#twP)" stroke="#fff" stroke-opacity="0.28" stroke-width="1.7"/>
    <g fill="#fff" fill-opacity="0.45">
      <rect x="74" y="80" width="76" height="9" rx="4.5"/>
      <rect x="74" y="108" width="112" height="6" rx="3"/>
      <rect x="74" y="128" width="96" height="6" rx="3"/>
      <rect x="74" y="148" width="112" height="6" rx="3"/>
      <rect x="74" y="168" width="64" height="6" rx="3"/>
      <rect x="74" y="196" width="112" height="6" rx="3"/>
      <rect x="74" y="216" width="88" height="6" rx="3"/>
    </g>
  </g>

  <!-- Arabic page: lines flush right -->
  <g transform="rotate(6 272 160)">
    <rect x="194" y="52" width="156" height="204" rx="14" fill="url(#twP)" stroke="#fff" stroke-opacity="0.34" stroke-width="1.7"/>
    <g fill="#fff" fill-opacity="0.5">
      <rect x="252" y="80" width="76" height="9" rx="4.5"/>
      <rect x="216" y="108" width="112" height="6" rx="3"/>
      <rect x="232" y="128" width="96" height="6" rx="3"/>
      <rect x="216" y="148" width="112" height="6" rx="3"/>
      <rect x="264" y="168" width="64" height="6" rx="3"/>
      <rect x="216" y="196" width="112" height="6" rx="3"/>
      <rect x="240" y="216" width="88" height="6" rx="3"/>
    </g>
  </g>
</svg>
