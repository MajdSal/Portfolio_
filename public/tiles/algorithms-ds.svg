<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Binary tree above a sorted array">
  <defs>
    <radialGradient id="alG" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#9FC2E8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#9FC2E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9FC2E8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="140" rx="185" ry="150" fill="url(#alG)"/>

  <!-- tree edges -->
  <g stroke="#fff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round">
    <path d="M200 62 L 126 122"/>
    <path d="M200 62 L 274 122"/>
    <path d="M126 122 L 78 182"/>
    <path d="M126 122 L 174 182"/>
    <path d="M274 122 L 322 182"/>
  </g>
  <!-- tree nodes -->
  <g fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.5" stroke-width="2">
    <circle cx="200" cy="62" r="19"/>
    <circle cx="126" cy="122" r="16"/>
    <circle cx="274" cy="122" r="16"/>
    <circle cx="78" cy="182" r="13"/>
    <circle cx="174" cy="182" r="13"/>
    <circle cx="322" cy="182" r="13"/>
  </g>
  <circle cx="200" cy="62" r="7" fill="#9FC2E8"/>

  <!-- sorted bars -->
  <g fill="url(#alB)">
    <rect x="66" y="256" width="26" height="18" rx="6"/>
    <rect x="106" y="246" width="26" height="28" rx="6"/>
    <rect x="146" y="236" width="26" height="38" rx="6"/>
    <rect x="186" y="226" width="26" height="48" rx="6"/>
    <rect x="226" y="216" width="26" height="58" rx="6"/>
    <rect x="266" y="206" width="26" height="68" rx="6"/>
    <rect x="306" y="196" width="26" height="78" rx="6"/>
  </g>
</svg>
